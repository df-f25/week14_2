name: ci-wf
on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
jobs:
  lint-job:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome Step
        run: echo "Welcome TO the Linting Job"
      - name: Clone Repo
        uses: actions/checkout@v6
      - name: Install Development Dependencies
        run: npm install
      - name: Lint HTML and CSS Files
        run: |
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"
  build-website-job:
    runs-on: ubuntu-latest
    needs: "lint-job"
    steps:
      - name: Weclome to Build Job
        run: echo "Weclome to Build Job"
      - name: Clone Repo
        uses: actions/checkout@v6
      - name: Install Dev-Dep
        run: npm install
      - name: Build Website with Parcel
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./" --no-cache
  build-image-job:
    runs-on: ubuntu-latest
    needs: "build-website-job"
    steps:
      - name: Welcome To the Image Building Job
        run: echo "Image Building Job Starting"
      - name: Clone The Repo
        uses: actions/checkout@v6
      - name: Login to Dockerhub 
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DHUB_USER}}
          password: ${{secrets.DHUB_TOKEN}}
      - name: Build Website Image
        run: docker image build -t ${{secrets.DHUB_USER}}/app:develop .
      - name: List the Available Images on Runner
        run: ls
      - name: Create and Rocker image un Container from New Image
        run: docker container run -d -p 2222:80 ${{secrets.DHUB_USER}}/app:develop
      - name: List The Running Containers
        run: docker container ls
      - name: Push Docker Image on the Dockerhub Registery
        run: docker push ${{secrets.DHUB_USER}}/app:develop